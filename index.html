<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MeloGo — Vállalj melót a közeledben</title>
  <meta name="description" content="Az első magyar app ahol percek alatt találsz házkörüli melót vagy megbízható melóst a közeledben." />
  <meta property="og:title" content="MeloGo" />
  <meta property="og:description" content="Vállalj melót a közeledben. Töltsd le most!" />
  <meta property="og:image" content="logo.jpg" />
  <meta name="theme-color" content="#f5f5f7" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* ── Subtle background texture ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(179,255,0,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(100,200,255,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Layout ── */
    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 48px 0 0;
    }

    /* ── Nav bar ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      margin-bottom: 56px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }

    .nav-logo-text {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.4px;
    }

    /* ── Hero ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      margin-bottom: 56px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(179,255,0,0.15);
      border: 1px solid rgba(130,210,0,0.3);
      color: #4a7c00;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 100px;
      letter-spacing: 0.2px;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6abf00;
      animation: pulse-green 1.8s ease-in-out infinite;
    }

    @keyframes pulse-green {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.6; }
    }

    .hero-title {
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.05;
      color: #1d1d1f;
      max-width: 720px;
      margin-bottom: 20px;
    }

    .hero-title span {
      background: linear-gradient(135deg, #6abf00 0%, #a8e000 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 18px;
      font-weight: 400;
      color: #6e6e73;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* ── Download badges ── */
    .download-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .badge-link {
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .badge-link:hover {
      transform: translateY(-3px);
      opacity: 0.85;
    }

    .badge-link img {
      height: 54px;
      width: auto;
      display: block;
    }

    /* ── Screenshots Marquee ── */
    .showcase {
      width: 100%;
      overflow: hidden;
      padding: 20px 0 40px;
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }

    .marquee-track {
      display: flex;
      gap: 20px;
      width: max-content;
      animation: scroll 32s linear infinite;
    }

    .showcase:hover .marquee-track {
      animation-play-state: paused;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-50% - 10px)); }
    }

    .screen-card {
      height: 460px;
      width: auto;
      border-radius: 28px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow:
        0 2px 8px rgba(0,0,0,0.06),
        0 16px 48px rgba(0,0,0,0.1);
      object-fit: cover;
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease;
    }

    .screen-card:hover {
      transform: translateY(-12px) scale(1.02);
      box-shadow:
        0 4px 16px rgba(0,0,0,0.08),
        0 32px 64px rgba(0,0,0,0.16);
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 40px;
      gap: 20px;
      border-top: 1px solid rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(20px);
    }

    .socials {
      display: flex;
      gap: 12px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #ffffff;
      border: 1.5px solid #e0e0e5;
      color: #1d1d1f;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .social-link:hover {
      border-color: #6abf00;
      color: #4a7c00;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(106,191,0,0.15);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .footer-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .footer-link {
      font-size: 13px;
      font-weight: 400;
      color: #6e6e73;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: #1d1d1f;
    }

    .footer-divider {
      color: #c0c0c8;
      font-size: 13px;
    }

    .copyright {
      font-size: 12px;
      color: #a1a1a6;
    }

    /* ── Animations ── */
    .fade {
      opacity: 0;
      animation: fade-in 0.7s ease-out forwards;
    }
    .d-1 { animation-delay: 0.05s; }
    .d-2 { animation-delay: 0.15s; }
    .d-3 { animation-delay: 0.25s; }
    .d-4 { animation-delay: 0.35s; }
    .d-5 { animation-delay: 0.45s; }
    .d-6 { animation-delay: 0.55s; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page-wrapper { padding-top: 32px; }
      .navbar { padding: 0 24px; margin-bottom: 40px; }
      .hero { margin-bottom: 40px; }
      .hero-title { letter-spacing: -1.5px; }
      .hero-subtitle { font-size: 16px; }
      .screen-card { height: 360px; border-radius: 22px; }
    }

    @media (max-width: 480px) {
      .screen-card { height: 290px; border-radius: 18px; }
      .download-row { flex-direction: column; align-items: center; }
      .store-btn { width: 100%; max-width: 230px; justify-content: center; }
    }
  </style>
</head>
