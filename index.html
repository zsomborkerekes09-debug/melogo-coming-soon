<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MeloGo — Vállalj melót a közeledben</title>
  <meta name="description" content="Az első magyar app ahol percek alatt találsz házkörüli melót vagy megbízható melóst a közeledben." />
  <meta property="og:title" content="MeloGo" />
  <meta property="og:description" content="Vállalj melót a közeledben. Töltsd le most!" />
  <meta property="og:image" content="logo.jpg" />
  <meta name="theme-color" content="#1C1C1E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #1C1C1E;
      color: #FFFFFF;
      /* Only clean, modern, evenly weighted sans-serif fonts */
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Layout ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px 0;
    }

    /* ── Nav bar ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 72px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .nav-logo img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .nav-logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 72px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(170, 255, 0, 0.1);
      border: 1px solid rgba(170, 255, 0, 0.2);
      color: #AAFF00;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 100px; /* Capsule */
      margin-bottom: 32px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #AAFF00;
      box-shadow: 0 0 8px #AAFF00;
    }

    .hero-title {
      font-size: clamp(44px, 8vw, 72px);
      font-weight: 200;
      /* Tight letter spacing for premium structured look */
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 24px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      color: #FFFFFF;
    }

    .hero-title span {
      color: #AAFF00;
    }

    .hero-subtitle {
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 300;
      color: #EBEBF5;
      opacity: 0.8;
      max-width: 600px;
      margin: 0 auto 48px auto;
      line-height: 1.5;
      letter-spacing: -0.01em;
    }

    /* ── Download badges ── */
    .download-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .badge-link {
      display: inline-block;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .badge-link:hover {
      transform: translateY(-3px);
      opacity: 0.9;
    }

    .badge-link img, .badge-link svg {
      height: 54px;
      width: auto;
      display: block;
    }

    /* ── Screenshots Grid (Carousel) ── */
    .showcase {
      padding: 0 0 80px 0;
      width: 100%;
    }
    
    .screenshot-grid {
      display: flex;
      gap: 32px;
      overflow-x: auto;
      padding: 32px 5vw; /* Generous padding to allow peeking next card */
      /* Scroll snapping for better mobile experience */
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      /* Hide scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    
    .screenshot-grid::-webkit-scrollbar {
      display: none;
    }

    .screen-card-container {
      flex: 0 0 auto;
      scroll-snap-align: center;
      background-color: #1E1E20;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 32px;
      padding: 16px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-card-container:hover {
      transform: translateY(-8px);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.7);
      border-color: rgba(170, 255, 0, 0.2);
    }

    .screen-card {
      height: 540px;
      width: auto;
      border-radius: 16px;
      /* Present straight-on, fully contained, NO cropping */
      object-fit: contain; 
      display: block;
      /* Ensure no accidental rotations */
      transform: none; 
    }

    /* ── Footer ── */
    .footer {
      background-color: #1C1C1E;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 40px 0;
      text-align: center;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50px; /* Pill shape */
      background-color: #2C2C2E;
      color: #FFFFFF;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .social-link:hover {
      background-color: #AAFF00;
      color: #000000;
      transform: scale(1.05);
    }

    .social-link svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .footer-link {
      font-size: 14px;
      color: #EBEBF5;
      opacity: 0.6;
      text-decoration: none;
      transition: opacity 0.2s ease, color 0.2s ease;
      letter-spacing: -0.01em;
    }

    .footer-link:hover {
      opacity: 1;
      color: #AAFF00;
    }

    .copyright {
      font-size: 13px;
      color: #EBEBF5;
      opacity: 0.4;
    }

    /* Animations */
    .fade-up {
      opacity: 0;
      animation: fade-up-anim 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .d-1 { animation-delay: 0.1s; }
    .d-2 { animation-delay: 0.2s; }
    .d-3 { animation-delay: 0.3s; }
    .d-4 { animation-delay: 0.4s; }

    @keyframes fade-up-anim {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .screen-card { height: 420px; }
      .screen-card-container { padding: 12px; border-radius: 24px; }
      .screenshot-grid { padding: 24px 8vw; gap: 24px; }
    }
